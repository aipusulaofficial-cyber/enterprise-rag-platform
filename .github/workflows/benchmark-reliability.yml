name: Benchmark And Reliability Evidence
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest -r requirements-prod.txt
      - name: Failure injection tests
        run: python -m pytest reliability/test_failure_injection.py -q
      - name: RAG retrieval evidence
        run: |
          python benchmarks/rag_evidence.py
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/rag-retrieval-evidence.json").read_text(encoding="utf-8"))
          if report["error_rate"] != 0:
              raise SystemExit(f"RAG evidence gate failed: error_rate={report['error_rate']}")
          if report["recall_at_1"] < 1.0:
              raise SystemExit(f"RAG retrieval gate failed: recall_at_1={report['recall_at_1']}")
          print(
              f"RAG evidence passed: recall_at_1={report['recall_at_1']:.3f}, "
              f"p95_ms={report['latency_ms']['p95']:.3f}"
          )
          PY
      - name: Upload measured evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rag-retrieval-evidence
          path: artifacts/rag-retrieval-evidence.json
          if-no-files-found: error