name: Platform Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run platform policy tests
        env:
          PYTHONPATH: platform
        run: python -m pytest platform/test_policy_gates.py -q
      - name: Security gate
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit
      - name: Evidence gate
        run: |
          test -f platform/CONTRACT-VERIFICATION.md
          test -f docs/AIPUSULA-PLATFORM-INTEGRATION.md