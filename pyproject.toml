[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-platform"
version = "0.1.0"
description = "Production-oriented AI systems engineering reference implementation"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1","pydantic>=2,<3","opentelemetry-api>=1.30,<2","opentelemetry-sdk>=1.30,<2","opentelemetry-exporter-otlp>=1.30,<2","httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest-cov>=5,<7", "mypy>=1.13,<2", "pytest>=8","hypothesis>=6","ruff>=0.7,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
py-modules = ["service", "rag_domain"]
